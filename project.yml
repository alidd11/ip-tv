name: IPTV
options:
  bundleIdPrefix: com.alidd11
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  IPTV:
    type: application
    platform: iOS
    sources:
      - path: ios-app
        excludes:
          - README.md
      - path: data
        type: folder
        buildPhase: resources
      - path: config
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alidd11.iptv.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "IP TV"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
