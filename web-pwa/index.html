<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07080d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IP TV" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <title>IP TV</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" aria-label="IP TV home"><span class="brand-mark">▶</span><span>IP TV</span></div>
      <button class="icon-button" id="searchButton" aria-label="Search">⌕</button>
    </header>
    <main>
      <section class="hero" id="hero">
        <div class="hero-glow"></div>
        <div class="hero-content">
          <div class="eyebrow">PREMIUM LIVE TV</div>
          <div class="badges" id="heroBadges"></div>
          <h1 id="heroTitle">Live television, beautifully organised.</h1>
          <p id="heroMeta">One catalogue across mobile and TV.</p>
          <div class="hero-actions">
            <button class="primary-button" id="heroPrimary">Watch live</button>
            <button class="secondary-button" id="guideButton">Guide</button>
          </div>
        </div>
      </section>
      <section class="country-strip" aria-label="Countries"><div class="chip-row" id="countryRow"></div></section>
      <section class="content" id="content"></section>
    </main>
    <nav class="tabbar" aria-label="Primary">
      <button class="tab active"><span>⌂</span><small>Home</small></button>
      <button class="tab"><span>◉</span><small>Live</small></button>
      <button class="tab"><span>▦</span><small>Guide</small></button>
      <button class="tab"><span>★</span><small>Saved</small></button>
    </nav>
    <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-backdrop" data-close-sheet></div>
      <div class="sheet-card">
        <div class="sheet-handle"></div>
        <button class="sheet-close" data-close-sheet aria-label="Close">×</button>
        <div class="eyebrow" id="sheetEyebrow">CHANNEL</div>
        <h2 id="sheetTitle"></h2>
        <p id="sheetMeta"></p>
        <button class="primary-button full" id="sheetAction"></button>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
