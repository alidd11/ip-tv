<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#000000"/><title>Player · IP TV</title><style>html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100%}body{display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0)}header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#07080d}button{border:0;background:#ffffff12;color:white;border-radius:12px;padding:10px 14px;font:inherit}h1{font-size:16px;margin:0}video{width:100%;height:100%;object-fit:contain;background:#000}.message{display:grid;place-items:center;padding:30px;color:#aaa;text-align:center}</style></head><body><header><button onclick="history.back()">‹ Back</button><h1 id="name">Live TV</h1></header><div id="stage"><video id="video" controls playsinline autoplay></video></div><script>const params=new URLSearchParams(location.search);const source=params.get("source");const video=document.getElementById("video");document.getElementById("name").textContent=params.get("name")||"Live TV";if(source&&video.canPlayType("application/vnd.apple.mpegurl")){video.src=source}else{document.getElementById("stage").innerHTML='<div class="message">This browser cannot play this source natively.</div>'}</script></body></html>
