name: Build iOS client

on:
  pull_request:
    paths:
      - "ios-app/**"
      - "project.yml"
      - "data/**"
      - "config/**"
      - ".github/workflows/ios-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iOS Simulator app
        run: xcodebuild -project IPTV.xcodeproj -scheme IPTV -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
