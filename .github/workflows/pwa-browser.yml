name: PWA functional browser test

on:
  pull_request:
    paths:
      - "web-pwa/**"
      - "data/**"
      - "config/**"
      - "scripts/pwa-smoke.mjs"
      - ".github/workflows/pwa-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Build isolated web release
        run: npm run build:web
      - name: Start PWA static server
        run: |
          python3 -m http.server 4173 -d dist > /tmp/iptv-pwa-http.log 2>&1 &
      - name: Run real browser checks
        run: node scripts/pwa-smoke.mjs
      - name: Preserve implementation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-implementation-screenshots
          path: artifacts/pwa/
          if-no-files-found: ignore
