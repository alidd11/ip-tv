name: Build Android clients

on:
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "client-data/**"
      - "mobile-android/**"
      - "tv-app/**"
      - "data/**"
      - "config/**"
  push:
    branches: [main]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "client-data/**"
      - "mobile-android/**"
      - "tv-app/**"
      - "data/**"
      - "config/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build mobile and TV debug APKs
        run: gradle :client-data:assemble :mobile-android:assembleDebug :tv-app:assembleDebug
